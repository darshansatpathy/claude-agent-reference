name: Live smoke test

# Manual on purpose: it calls the real Claude API and costs a few cents.
# Requires the repository secret ANTHROPIC_API_KEY, scoped to a protected environment.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id to test (defaults to the library default)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    environment: live-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Smoke test against the live API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_AGENT_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$CLAUDE_AGENT_MODEL" ]; then unset CLAUDE_AGENT_MODEL; fi
          claude-agent smoke
